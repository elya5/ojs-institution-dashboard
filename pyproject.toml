[project]
name = "ojs-insitution-dashboard"
version = "0.1.0"
description = "Dashboard showing information on OJS usage for an institution."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cachetools>=7.0.5",
    "cashews[redis]>=7.5.0",
    "country-converter>=1.3.2",
    "fastapi[standard]>=0.136.1",
    "polars>=1.39.3",
    "pyalex>=0.21",
    "pyarrow>=23.0.1",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "tqdm>=4.67.3",
]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "UP",
    "E",
    "F",
    "RUF",
    "I",
    "UP",
    "S",
    "A",
    "C4",
    "SIM",
    "PTH",
    "ERA001",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
